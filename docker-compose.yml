version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nutripath_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-nutripath}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nutripath-network

  redis:
    image: redis:7-alpine
    container_name: nutripath_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    networks:
      - nutripath-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutripath_backend
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-nutripath}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-nutripath}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-key-nutripath}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    networks:
      - nutripath-network

volumes:
  postgres_data:
  redis_data:

networks:
  nutripath-network:
    driver: bridge
